name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as 0.1.0a1
        required: true

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install build packaging pytest
      - name: Set the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          from packaging.version import Version

          version = Version(os.environ["VERSION"])
          path = pathlib.Path("pyproject.toml")
          text, count = re.subn(r'(?m)^version = ".*"$', f'version = "{version}"', path.read_text(), count=1)
          assert count == 1, "pyproject.toml has no version line"
          path.write_text(text)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"RELEASE_VERSION={version}\nPRERELEASE={str(version.is_prerelease).lower()}\n")
          PY
      - run: python -m build
      - run: python -m pip install "$(ls dist/*.whl)" && python -m pytest tests src/usepylon/tests
      - name: Tag and create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$RELEASE_VERSION"
          git tag "v$RELEASE_VERSION"
          git push origin HEAD:main "v$RELEASE_VERSION"
          prerelease=()
          if [[ "$PRERELEASE" == true ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "v$RELEASE_VERSION" dist/* --generate-notes "${prerelease[@]}"
