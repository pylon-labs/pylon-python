[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "usepylon"
version = "0.1.0a1"
description = "Official Python SDK for the Pylon API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Pylon" }]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.21.2",
    "pydantic>=1.9.2",
    "typing_extensions>=4.0.0",
]

[project.optional-dependencies]
aiohttp = ["aiohttp>=3.10.0,<4", "httpx-aiohttp==0.1.8"]

[project.urls]
Homepage = "https://usepylon.com"
Documentation = "https://docs.usepylon.com"
Repository = "https://github.com/pylon-labs/pylon-python"

[tool.hatch.build.targets.wheel]
packages = ["src/usepylon"]
exclude = ["src/usepylon/tests"]

[tool.hatch.build.targets.sdist]
include = ["src/usepylon", "README.md", "reference.md", "LICENSE"]
exclude = ["src/usepylon/tests"]
